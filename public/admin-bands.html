<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OHMS Band Admin</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <main class="admin-shell admin-workspace">
      <section class="panel list-panel">
        <div class="list-header">
          <h2>Current Bands</h2>
          <span id="bandCount" class="count">0</span>
        </div>
        <div id="bandsList" class="bands-list"></div>
      </section>

      <section class="panel editor-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">OHMS</p>
            <h1>Add Band</h1>
          </div>
          <div class="header-actions">
            <a class="secondary-link" href="/admin">ADMIN</a>
            <button id="refreshButton" type="button">Refresh</button>
          </div>
        </div>

        <form id="bandForm" class="band-form">
          <label>
            <span>Name</span>
            <input id="name" name="name" type="text" autocomplete="off" required>
          </label>

          <div class="form-row">
            <label>
              <span>City</span>
              <input id="city" name="city" type="text" autocomplete="address-level2">
            </label>

            <label>
              <span>State</span>
              <input id="state" name="state" type="text" maxlength="2" autocomplete="address-level1">
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>Years Active</span>
              <input id="years_active" name="years_active" type="text" placeholder="1973-present">
            </label>

            <div class="photo-field">
              <span>Picture</span>
              <input id="picture_url" name="picture_url" type="hidden">
              <input id="picture_file" name="picture_file" type="file" accept="image/*">
              <label class="photo-button" for="picture_file">Select Photo</label>
              <div class="photo-preview" data-photo-preview>No photo selected</div>
            </div>
          </div>

          <label>
            <span>Notes</span>
            <textarea id="notes" name="notes" rows="3"></textarea>
          </label>

          <section class="form-section">
            <div class="section-header">
              <h2>Band Members</h2>
              <button id="addMemberButton" type="button" class="secondary-button">Add Artist</button>
            </div>
            <div id="bandMembersList" class="member-list"></div>
          </section>

          <div class="form-actions">
            <p id="statusMessage" class="status" role="status"></p>
            <div class="edit-actions">
              <button id="cancelEditButton" type="button" class="secondary-button hidden">Cancel</button>
              <button id="submitButton" type="submit">Add Band</button>
            </div>
          </div>
        </form>
      </section>

    </main>

    <script src="/admin.js"></script>
  </body>
</html>
