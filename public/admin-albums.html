<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OHMS Album Admin</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <main class="admin-shell admin-workspace">
      <section class="panel list-panel">
        <div class="list-header">
          <h2>Current Albums</h2>
          <span id="albumCount" class="count">0</span>
        </div>
        <div id="albumsList" class="bands-list"></div>
      </section>

      <section class="panel editor-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">OHMS</p>
            <h1>Add Album</h1>
          </div>
          <div class="header-actions">
            <a class="secondary-link" href="/admin">ADMIN</a>
            <button id="refreshButton" type="button">Refresh</button>
          </div>
        </div>

        <form id="albumForm" class="band-form">
          <label>
            <span>Album Title</span>
            <input id="title" name="title" type="text" autocomplete="off" required>
          </label>

          <div class="form-row">
            <label>
              <span>Existing Band</span>
              <select id="band_id" name="band_id"></select>
            </label>

            <label>
              <span>New Band</span>
              <input id="band_name" name="band_name" type="text" autocomplete="off" placeholder="Type name if not listed">
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>Year of Release</span>
              <input id="release_year" name="release_year" type="text" placeholder="1978">
            </label>

            <div class="photo-field">
              <span>Album Cover</span>
              <input id="cover_url" name="cover_url" type="hidden">
              <input id="cover_file" name="cover_file" type="file" accept="image/*">
              <label class="photo-button" for="cover_file">Select Cover</label>
              <div class="photo-preview" data-photo-preview>No cover selected</div>
            </div>
          </div>

          <label>
            <span>Notes</span>
            <textarea id="notes" name="notes" rows="3"></textarea>
          </label>

          <section class="form-section">
            <div class="section-header">
              <h2>Album Songs</h2>
              <button id="addSongButton" type="button" class="secondary-button">Add Song</button>
            </div>
            <div id="albumSongsList" class="member-list"></div>
          </section>

          <div class="form-actions">
            <p id="statusMessage" class="status" role="status"></p>
            <div class="edit-actions">
              <button id="editRecordButton" type="button" class="secondary-button hidden">Edit</button>
              <button id="submitButton" type="submit">Add Album</button>
              <button id="cancelEditButton" type="button" class="secondary-button hidden">Cancel</button>
              <button id="deleteRecordButton" type="button" class="danger-button hidden">Delete</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script src="/admin-albums.js"></script>
  </body>
</html>
